name: cloud-console-delivery
'on':
  push:
    branches:
    - main
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
    - name: Dispatch cloud build and gated deployment
      env:
        TOKEN: ${{ secrets.CONSOLE_DISPATCH_TOKEN }}
        SOURCE_SHA: ${{ github.sha }}
        SOURCE_REPO: ${{ github.repository }}
      run: 'python3 - <<''PYCODE''

        import os,json,urllib.request,uuid

        inputs={"mode":"source","job":"source-"+str(uuid.uuid4()),"app":''console-source'',"source_repo":os.environ["SOURCE_REPO"],"source_ref":os.environ["SOURCE_SHA"],"dockerfile":''Dockerfile'',"context":''.''}

        request=urllib.request.Request("https://api.github.com/repos/Yinlerens/cloud-console/actions/workflows/application-image.yml/dispatches",method="POST",headers={"Authorization":"Bearer
        "+os.environ["TOKEN"],"Content-Type":"application/json"},data=json.dumps({"ref":"main","inputs":inputs}).encode())

        with urllib.request.urlopen(request) as response:assert response.status==204

        PYCODE'
