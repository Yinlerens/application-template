apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-budget
spec:
  hard:
    {{- toYaml .Values.quota | nindent 4 }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: application-defaults
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 50m, memory: 96Mi}
      default: {memory: 256Mi}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: declared-application-connections
spec:
  endpointSelector: {}
  ingress:
    - fromEntities: [ingress]
      toPorts:
        - ports:
            - {port: '8080', protocol: TCP}
          rules:
            http:
              {{- range .Values.publicPaths }}
              - path: {{ . | quote }}
              {{- end }}
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
      toPorts:
        - ports:
            - {port: '8080', protocol: TCP}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: '53', protocol: UDP}
            - {port: '53', protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: alloy
      toPorts:
        - ports:
            - {port: '4318', protocol: TCP}
            - {port: '4317', protocol: TCP}
{{- if .Values.database.enabled }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: database-clients-only
spec:
  endpointSelector:
    matchExpressions:
      - key: component
        operator: In
        values: [api, worker, cronjob]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.database.namespace }}
            k8s:cnpg.io/cluster: {{ .Values.database.cluster }}
      toPorts:
        - ports:
            - {port: '5432', protocol: TCP}
{{- end }}
